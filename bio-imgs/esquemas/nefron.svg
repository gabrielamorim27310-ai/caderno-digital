 340 C360 300 420 300 430 260 C440 220 480 200 520 210 L520 500');animation:fil-v 4s linear 0s infinite"/><style>@keyframes fil-v{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}</style><g class="reab"><path d="M270 300 l-34 0" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><path d="M300 410 l-34 0" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><path d="M360 410 l-34 0" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><path d="M430 270 l-34 0" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/></g><text x="120" y="372" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="middle">reabsorção</text><text x="120" y="390" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#2f6fd6" text-anchor="middle">(glicose, água, sais)</text><g class="adh"><path d="M520 300 l40 0" fill="none" stroke="#1f8a55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><path d="M520 420 l40 0" fill="none" stroke="#1f8a55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/></g><text x="595" y="300" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1f8a55" text-anchor="middle">ADH:</text><text x="595" y="318" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f8a55" text-anchor="middle">mais água</text><text x="595" y="336" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f8a55" text-anchor="middle">volta</text><path d="M520 505 L520 545" fill="none" stroke="#e0a800" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><text x="470" y="548" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#e0a800" text-anchor="middle">urina</text>
