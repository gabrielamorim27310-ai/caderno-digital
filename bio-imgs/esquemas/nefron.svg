<rect width="640" height="560" rx="28" fill="#f1f7f3"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#1d2b24" text-anchor="middle">Néfron: filtração e reabsorção</text>
