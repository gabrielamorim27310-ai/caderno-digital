<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.a,.b,.c,.d,.e,.f{transform-box:fill-box;transform-origin:center}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f1f7f3"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#1d2b24" text-anchor="middle">Onde age cada enzima</text>
<g transform="translate(150 0)"><path d="M320 90 L320 160 C320 190 300 200 300 230 C300 290 420 280 420 230 C420 200 380 200 350 250 L340 300 C330 330 250 330 250 360 C250 390 390 380 390 410 C390 440 250 440 250 470 C250 500 330 500 330 530" fill="none" stroke="#f0b8a8" stroke-width="30" stroke-linecap="round"/><path d="M320 90 L320 160 C320 190 300 200 300 230 C300 290 420 280 420 230 C420 200 380 200 350 250 L340 300 C330 330 250 330 250 360 C250 390 390 380 390 410 C390 440 250 440 250 470 C250 500 330 500 330 530" fill="none" stroke="#fbe1d8" stroke-width="18" stroke-linecap="round"/><circle class="bolo" r="10" fill="#e8730c" stroke="#fff" stroke-width="2" style="offset-path:path('M320 90 L320 160 C320 190 300 200 300 230 C300 290 420 280 420 230 C420 200 380 200 350 250 L340 300 C330 330 250 330 250 360 C250 390 390 380 390 410 C390 440 250 440 250 470 C250 500 330 500 330 530');animation:bolo-v 5s linear 0s infinite"/><style>@keyframes bolo-v{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}</style></g><text x="40" y="90" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f6fd6" text-anchor="start">BOCA · pH 7</text><text x="40" y="112" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2b24" text-anchor="start">amilase salivar: amido → maltose</text><text x="40" y="240" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#d64545" text-anchor="start">ESTÔMAGO · pH 2</text><text x="40" y="262" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2b24" text-anchor="start">pepsina (HCl): proteínas → peptídeos</text><text x="40" y="350" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f8a55" text-anchor="start">DUODENO · pH 8</text><text x="40" y="372" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2b24" text-anchor="start">pancreáticas: amilase, tripsina, lipase</text><text x="40" y="445" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#7a4cc2" text-anchor="start">INTESTINO DELGADO</text><text x="40" y="467" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="600" fill="#1d2b24" text-anchor="start">maltase, lactase, peptidases: absorção</text><text x="40" y="535" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#e0a800" text-anchor="start">bile (fígado): emulsifica a gordura, mas não é enzima</text>
</svg>