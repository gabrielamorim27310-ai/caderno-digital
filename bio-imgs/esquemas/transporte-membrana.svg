="#2f6fd6" opacity=".75"/><rect x="496" y="240" width="48" height="80" rx="12" fill="#d64545" opacity=".8"/><text x="470" y="410" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#e0a800" text-anchor="middle">ATP</text><circle cx="520" cy="372" r="0" /><circle class="dif d0" cx="90" cy="190" r="9" fill="#1f8a55"/><circle class="dif d1" cx="130" cy="175" r="9" fill="#1f8a55"/><circle class="dif d2" cx="150" cy="205" r="9" fill="#1f8a55"/><circle class="dif d3" cx="110" cy="220" r="9" fill="#1f8a55"/><rect class="fac f0" x="292" y="182" width="16" height="16" rx="3" fill="#2f6fd6"/><rect class="fac f1" x="322" y="164" width="16" height="16" rx="3" fill="#2f6fd6"/><rect class="fac f2" x="337" y="202" width="16" height="16" rx="3" fill="#2f6fd6"/><circle class="atv a0" cx="505" cy="380" r="9" fill="#d64545"/><circle class="atv a1" cx="535" cy="395" r="9" fill="#d64545"/><path d="M120 200 L120 360" fill="none" stroke="#1f8a55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><path d="M320 200 L320 360" fill="none" stroke="#2f6fd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><path d="M570 380 L570 200" fill="none" stroke="#d64545" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)"/><text x="320" y="450" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1d2b24" text-anchor="middle">a favor do gradiente: passivo, sem gastar energia</text><text x="320" y="480" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1d2b24" text-anchor="middle">contra o gradiente: ativo, gasta ATP (bomba de Na⁺/K⁺)</text><text x="320" y="520" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f6fd6" text-anchor="middle">osmose: a água vai para o lado com mais soluto</text>
