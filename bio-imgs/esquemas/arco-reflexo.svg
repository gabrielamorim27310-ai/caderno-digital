<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.a,.b,.c,.d,.e,.f{transform-box:fill-box;transform-origin:center}
@keyframes contrai{0%,80%{transform:scaleX(1)}88%,96%{transform:scaleX(.8)}100%{transform:scaleX(1)}}.musc{animation:contrai 2.6s infinite}@keyframes pisca{0%,100%{opacity:.4}50%{opacity:1}}.chama{animation:pisca .6s infinite}@keyframes tarde{0%,85%{opacity:0}92%,100%{opacity:1}}.sobe{animation:tarde 2.6s infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f1f7f3"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#1d2b24" text-anchor="middle">Arco reflexo: resposta pela medula</text>
<ellipse cx="350" cy="290" rx="95" ry="80" fill="#efe3d0" stroke="#6b7a72" stroke-width="3"/><path d="M310 240 Q350 270 390 240 Q370 290 390 340 Q350 310 310 340 Q330 290 310 240Z" fill="#c9b8a0"/><text x="350" y="392" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#6b7a72" text-anchor="middle">medula espinal</text><circle cx="70" cy="160" r="24" fill="#f3c9a6" stroke="#1d2b24" stroke-width="2"/><text x="70" y="120" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d2b24" text-anchor="middle">receptor</text><g class="chama"><path d="M70 205 q-12 18 0 34 q12 -16 0 -34z" fill="#e8730c"/></g><ellipse cx="560" cy="420" rx="50" ry="26" fill="#e7a3a3" stroke="#d64545" stroke-width="3" class="musc"/><text x="560" y="470" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1d2b24" text-anchor="middle">músculo (efetor)</text><path d="M94 160 C160 160 200 200 262 248" fill="none" stroke="#2f6fd6" stroke-width="6"/><text x="160" y="222" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#2f6fd6" text-anchor="middle">sensitivo</text><path d="M262 248 L388 300" fill="none" stroke="#7a4cc2" stroke-width="6"/><text x="330" y="214" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#7a4cc2" text-anchor="middle">associativo</text><path d="M388 300 C430 340 470 390 515 412" fill="none" stroke="#1f8a55" stroke-width="6"/><text x="470" y="330" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1f8a55" text-anchor="middle">motor</text><path class="sobe" d="M350 210 L350 90" fill="none" stroke="#6b7a72" stroke-width="3" stroke-dasharray="6 6"/><text x="350" y="80" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#6b7a72" text-anchor="middle">ao cérebro: a dor é sentida depois</text><circle class="sinal" r="12" fill="#e8730c" stroke="#fff" stroke-width="2" style="offset-path:path('M80 160 C160 160 200 200 260 250 L330 280 L390 300 C430 340 470 390 540 410');animation:sinal-v 2.6s linear 0s infinite"/><style>@keyframes sinal-v{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}</style><text x="320" y="520" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#e8730c" text-anchor="middle">receptor → sensitivo → associativo → motor → músculo</text>
</svg>