<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.a,.b,.c,.d,.e,.f{transform-box:fill-box;transform-origin:center}
.gang{transform-box:view-box;transform-origin:320px 388px;animation:gangorra 4s ease-in-out infinite}@keyframes gangorra{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f1f7f3"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#1d2b24" text-anchor="middle">Simpático × parassimpático</text>
<path d="M320 400 L280 470 L360 470 Z" fill="#6b7a72"/><g class="gang"><rect x="90" y="380" width="460" height="16" rx="8" fill="#1d2b24"/><g><text x="160" y="300" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#d64545" text-anchor="middle">SIMPÁTICO</text><text x="160" y="330" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1d2b24" text-anchor="middle">luta e fuga</text><text x="160" y="356" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#d64545" text-anchor="middle">noradrenalina</text></g><g><text x="480" y="300" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f8a55" text-anchor="middle">PARASSIMPÁTICO</text><text x="480" y="330" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1d2b24" text-anchor="middle">repouso e digestão</text><text x="480" y="356" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#1f8a55" text-anchor="middle">acetilcolina</text></g></g><text x="160" y="110" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#d64545" text-anchor="middle">♥ acelera</text><text x="160" y="145" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2b24" text-anchor="middle">pupila dilata</text><text x="160" y="175" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2b24" text-anchor="middle">digestão para</text><text x="160" y="205" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2b24" text-anchor="middle">brônquios dilatam</text><text x="480" y="110" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f8a55" text-anchor="middle">♥ desacelera</text><text x="480" y="145" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2b24" text-anchor="middle">pupila contrai</text><text x="480" y="175" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2b24" text-anchor="middle">digestão ativa</text><text x="480" y="205" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#1d2b24" text-anchor="middle">brônquios contraem</text><text x="320" y="525" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#1d2b24" text-anchor="middle">ações antagônicas: um acelera, o outro freia</text>
</svg>