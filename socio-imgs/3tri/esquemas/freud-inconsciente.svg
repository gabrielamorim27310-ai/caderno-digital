<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.onda{animation:onda 2.5s linear infinite}@keyframes onda{to{transform:translateX(-80px)}}.flecha{stroke-dasharray:14 10;animation:flecha .9s linear infinite}.f2{animation-delay:.3s}@keyframes flecha{to{stroke-dashoffset:-48}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">Freud: o inconsciente</text>
<rect x="170" y="200" width="440" height="280" rx="18" fill="#cfe6f7"/><path class="onda" d="M170 200 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#2f6fd6" stroke-width="3"/><path d="M370 120 L440 200 L300 200 Z" fill="#fff" stroke="#2f6fd6" stroke-width="3"/><path d="M300 200 L440 200 L520 290 L490 420 L380 470 L270 430 L240 300 Z" fill="#a9cdea" stroke="#2f6fd6" stroke-width="3"/><text x="370" y="180" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#2f6fd6" text-anchor="middle">consciente</text><text x="380" y="300" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#24182f" text-anchor="middle">inconsciente</text><text x="380" y="328" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#24182f" text-anchor="middle">(Id)</text><text x="380" y="360" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#24182f" text-anchor="middle">fonte de desejos</text><rect x="34" y="250" width="140" height="96" rx="12" fill="#24182f"/><rect x="46" y="261" width="116" height="66" rx="6" fill="#ffb3c7"/><text x="104" y="290" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#24182f" text-anchor="middle">mídia e</text><text x="104" y="310" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#24182f" text-anchor="middle">mercado</text><path d="M180 300 L262 320" fill="none" stroke="#c2336f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)" class="flecha f1"/><path d="M180 320 L250 380" fill="none" stroke="#c2336f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)" class="flecha f2"/><text x="320" y="520" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#6c3483" text-anchor="middle">Debord: as imagens moldam os nossos desejos</text>
</svg>