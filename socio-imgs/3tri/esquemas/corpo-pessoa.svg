<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.alma{animation:alma 4s ease-in-out infinite}@keyframes alma{0%,100%{transform:translate(0,0);opacity:.9}50%{transform:translate(18px,-60px);opacity:.5}}.lacos{animation:lacos 1.2s linear infinite}@keyframes lacos{to{stroke-dashoffset:-24}}.cresce{animation:cresce 4s ease-in-out infinite}@keyframes cresce{0%,100%{transform:scale(.9)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">Onde está a pessoa?</text>
<path d="M320 80 L320 440" stroke="#6f6479" stroke-width="2" stroke-dasharray="6 8"/><text x="165" y="105" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#2f6fd6" text-anchor="middle">Ocidente</text><g transform="translate(165 300) scale(1.6)"><path d="M-34 78 Q-34 30 0 30 Q34 30 34 78 Z" fill="#9fb6e6"/><circle cx="0" cy="0" r="22" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/></g><g class="alma"><g transform="translate(165 300) scale(1.6)"><path d="M-34 78 Q-34 30 0 30 Q34 30 34 78 Z" fill="none" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="4 4"/><circle cx="0" cy="0" r="22" fill="none" stroke="#2f6fd6" stroke-width="2" stroke-dasharray="4 4"/></g></g><text x="165" y="470" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#2f6fd6" text-anchor="middle">corpo × alma</text><text x="165" y="498" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#24182f" text-anchor="middle">a pessoa está no interior</text><text x="165" y="520" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#6f6479" text-anchor="middle">(alma, razão, consciência)</text><text x="480" y="105" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f8a55" text-anchor="middle">Povos ameríndios</text><g class="lacos"><path d="M480 300 L395 180 M480 300 L580 200 M480 300 L585 380 M480 300 L385 395" stroke="#1f8a55" stroke-width="3" stroke-dasharray="6 6"/></g><g class="cresce"><g transform="translate(480 290) scale(1.25)"><path d="M-34 78 Q-34 30 0 30 Q34 30 34 78 Z" fill="#1f8a55"/><circle cx="0" cy="0" r="22" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/></g></g><circle cx="395" cy="170" r="22" fill="#e9a23b" stroke="#24182f" stroke-width="2"/><circle cx="388" cy="166" r="3" fill="#24182f"/><circle cx="402" cy="166" r="3" fill="#24182f"/><path d="M580 214 L580 236" stroke="#8a5a2b" stroke-width="6"/><circle cx="580" cy="196" r="22" fill="#1f8a55"/><g transform="translate(588 372) scale(0.55)"><path d="M-34 78 Q-34 30 0 30 Q34 30 34 78 Z" fill="#6c3483"/><circle cx="0" cy="0" r="22" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/></g><g transform="translate(382 386) scale(0.55)"><path d="M-34 78 Q-34 30 0 30 Q34 30 34 78 Z" fill="#c2336f"/><circle cx="0" cy="0" r="22" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/></g><text x="480" y="470" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f8a55" text-anchor="middle">corpo + alma juntos</text><text x="480" y="498" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#24182f" text-anchor="middle">a pessoa se faz pelo corpo</text><text x="480" y="520" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#24182f" text-anchor="middle">e pelas relações</text>
</svg>