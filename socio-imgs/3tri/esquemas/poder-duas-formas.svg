<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.manda{stroke-dasharray:12 8;animation:manda .8s linear infinite}@keyframes manda{to{stroke-dashoffset:-40}}.giro{transform-box:view-box;transform-origin:480px 290px;animation:giro 18s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}.fala{animation:fala 1.4s ease-in-out infinite}@keyframes fala{0%,100%{opacity:.2}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">Duas formas de poder político</text>
<path d="M320 80 L320 450" stroke="#6f6479" stroke-width="2" stroke-dasharray="6 8"/><path d="M60 430 L280 430 L170 130 Z" fill="#f3d6d6" stroke="#d64545" stroke-width="3"/><circle cx="170" cy="175" r="16" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><path d="M156 160 L160 148 L170 156 L180 148 L184 160Z" fill="#e0a800"/><circle cx="130" cy="300" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="170" cy="300" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="210" cy="300" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="100" cy="395" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="140" cy="395" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="180" cy="395" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="220" cy="395" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><circle cx="255" cy="395" r="11" fill="#f3c9a6" stroke="#24182f" stroke-width="1.5"/><path d="M170 200 L170 280" fill="none" stroke="#d64545" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)" class="manda m1"/><path d="M150 320 L130 375" fill="none" stroke="#d64545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)" class="manda m2"/><path d="M190 320 L210 375" fill="none" stroke="#d64545" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ponta)" class="manda m3"/><text x="170" y="472" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#d64545" text-anchor="middle">coercitivo</text><text x="170" y="500" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#24182f" text-anchor="middle">comando e obediência</text><text x="170" y="522" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#6f6479" text-anchor="middle">separado da sociedade</text><circle cx="480" cy="290" r="112" fill="none" stroke="#1f8a55" stroke-width="3" stroke-dasharray="4 8"/><g class="giro"><circle cx="592.0" cy="290.0" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="559.2" cy="369.2" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="480.0" cy="402.0" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="400.8" cy="369.2" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="368.0" cy="290.0" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="400.8" cy="210.8" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="480.0" cy="178.0" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="559.2" cy="210.8" r="15" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/></g><circle cx="480" cy="290" r="18" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><path class="fala" d="M506 270 q10 20 0 40 M520 260 q16 30 0 60" fill="none" stroke="#1f8a55" stroke-width="3" stroke-linecap="round"/><text x="480" y="472" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#1f8a55" text-anchor="middle">não coercitivo</text><text x="480" y="500" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#24182f" text-anchor="middle">persuasão e prestígio</text><text x="480" y="522" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="600" fill="#6f6479" text-anchor="middle">dentro da sociedade</text>
</svg>