<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.giro{animation:giro 9s linear infinite}@keyframes giro{to{transform:rotate(360deg)}}.sobe{transform-box:fill-box;animation:sobe 3s ease-out infinite;opacity:0}.c2{animation-delay:1s}.c3{animation-delay:2s}@keyframes sobe{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-230px) scale(1.2);opacity:0}}.onda{animation:onda 2.5s linear infinite}@keyframes onda{to{transform:translateX(-48px)}}.olhar{animation:olhar 1s linear infinite}@keyframes olhar{to{stroke-dashoffset:-32}}.nuvem{animation:nuvem 4s ease-in-out infinite}@keyframes nuvem{0%,20%{opacity:0;transform:translateY(8px)}35%,85%{opacity:1;transform:translateY(0)}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">O mundo fictício do espetáculo</text>
