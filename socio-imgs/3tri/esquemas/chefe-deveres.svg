<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.dever{transform-box:fill-box;transform-origin:center;animation:dever 6s ease-in-out infinite}.d2{animation-delay:2s}.d3{animation-delay:4s}@keyframes dever{0%,30%,100%{transform:scale(1)}10%,20%{transform:scale(1.06)}}.calma{animation:calma 1.5s ease-in-out infinite}@keyframes calma{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">O chefe (mburuvicha)</text>
<path d="M320 190 L122 300 M320 190 L320 300 M320 190 L518 300" stroke="#6c3483" stroke-width="3" stroke-dasharray="5 7"/><ellipse cx="320" cy="96" rx="8" ry="26" fill="#e0a800" transform="rotate(-50 320 128)"/><ellipse cx="320" cy="96" rx="8" ry="26" fill="#d64545" transform="rotate(-25 320 128)"/><ellipse cx="320" cy="96" rx="8" ry="26" fill="#1f8a55" transform="rotate(0 320 128)"/><ellipse cx="320" cy="96" rx="8" ry="26" fill="#d64545" transform="rotate(25 320 128)"/><ellipse cx="320" cy="96" rx="8" ry="26" fill="#e0a800" transform="rotate(50 320 128)"/><g transform="translate(320 130) scale(1.2)"><path d="M-34 78 Q-34 30 0 30 Q34 30 34 78 Z" fill="#6c3483"/><circle cx="0" cy="0" r="22" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/></g><g class="dever d1"><rect x="30" y="300" width="184" height="168" rx="18" fill="#fff" stroke="#6c3483" stroke-width="3"/><circle cx="95" cy="350" r="14" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><circle cx="149" cy="350" r="14" fill="#f3c9a6" stroke="#24182f" stroke-width="2"/><path class="calma" d="M111 352 q8 -10 16 0 t16 0" stroke="#1f8a55" stroke-width="3" fill="none"/><text x="122" y="408" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#6c3483" text-anchor="middle">Apaziguar</text><text x="122" y="432" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#24182f" text-anchor="middle">conflitos pela</text><text x="122" y="452" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#6f6479" text-anchor="middle">persuasão e prestígio</text></g><g class="dever d2"><rect x="228" y="300" width="184" height="168" rx="18" fill="#fff" stroke="#6c3483" stroke-width="3"/><rect x="298" y="332" width="44" height="34" rx="4" fill="#c2336f"/><rect x="294" y="324" width="52" height="12" rx="3" fill="#c2336f"/><path d="M320 324 L320 366" stroke="#e0a800" stroke-width="5"/><path d="M320 324 q-14 -16 -18 -2 q4 6 18 2 q14 4 18 -2 q-4 -14 -18 2" fill="#e0a800"/><text x="320" y="408" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#6c3483" text-anchor="middle">Doar bens</text><text x="320" y="432" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#24182f" text-anchor="middle">ao grupo, por</text><text x="320" y="452" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#6f6479" text-anchor="middle">generosidade</text></g><g class="dever d3"><rect x="426" y="300" width="184" height="168" rx="18" fill="#fff" stroke="#6c3483" stroke-width="3"/><path d="M478 326 h80 a10 10 0 0 1 10 10 v28 a10 10 0 0 1 -10 10 h-50 l-14 12 v-12 h-16 a10 10 0 0 1 -10 -10 v-28 a10 10 0 0 1 10 -10z" fill="#2f6fd6"/><path d="M484 342 h68 M484 356 h48" stroke="#fff" stroke-width="4" stroke-linecap="round"/><text x="518" y="408" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#6c3483" text-anchor="middle">Falar todo dia</text><text x="518" y="432" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#24182f" text-anchor="middle">o dever</text><text x="518" y="452" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600" fill="#6f6479" text-anchor="middle">da palavra</text></g><text x="320" y="512" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#d64545" text-anchor="middle">sem força de lei: quem tenta mandar é abandonado</text>
</svg>