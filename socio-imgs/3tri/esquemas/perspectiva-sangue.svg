8 8"/><path class="olhar" d="M492 252 L350 252" stroke="#6f6479" stroke-width="3" stroke-dasharray="8 8"/><path class="pulsa gota" d="M320 196 C320 196 288 240 288 266 A32 32 0 0 0 352 266 C352 240 320 196 320 196Z" fill="#d64545"/><text x="320" y="330" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#d64545" text-anchor="middle">sangue</text><g class="bal1"><rect x="30" y="360" width="200" height="86" rx="16" fill="#fff" stroke="#d64545" stroke-width="3"/><text x="130" y="394" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#6f6479" text-anchor="middle">para o humano</text><text x="130" y="424" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#d64545" text-anchor="middle">morte, algo ruim</text></g><g class="bal2"><rect x="410" y="360" width="200" height="86" rx="16" fill="#fff" stroke="#1f8a55" stroke-width="3"/><text x="510" y="394" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="600" fill="#6f6479" text-anchor="middle">para a onça</text><text x="510" y="424" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#1f8a55" text-anchor="middle">alimento, algo bom</text></g><text x="320" y="492" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#6c3483" text-anchor="middle">uma só cultura, muitas naturezas</text><text x="320" y="524" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#24182f" text-anchor="middle">corpos diferentes = perspectivas diferentes</text>
