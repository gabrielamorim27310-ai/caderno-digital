<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.gota{animation:gota 1.6s ease-in-out infinite}@keyframes gota{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}.olhar{animation:olhar 1s linear infinite}@keyframes olhar{to{stroke-dashoffset:-32}}.bal1{animation:bal1 6s ease-in-out infinite}.bal2{animation:bal2 6s ease-in-out infinite}@keyframes bal1{0%{opacity:0}10%,100%{opacity:1}}@keyframes bal2{0%,30%{opacity:0}42%,100%{opacity:1}}
