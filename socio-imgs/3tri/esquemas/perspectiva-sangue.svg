<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">O mesmo sangue, duas perspectivas</text>
