d="M395 201 L398.5 211.5 L409 215 L398.5 218.5 L395 229 L391.5 218.5 L381 215 L391.5 211.5Z" fill="#e0a800"/><path class="brilho b2" d="M570 209 L572.75 217.25 L581 220 L572.75 222.75 L570 231 L567.25 222.75 L559 220 L567.25 217.25Z" fill="#e0a800"/><path class="brilho b3" d="M585 332 L588.25 341.75 L598 345 L588.25 348.25 L585 358 L581.75 348.25 L572 345 L581.75 341.75Z" fill="#e0a800"/><text x="480" y="410" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#24182f" text-anchor="middle">paga-se pela imagem</text><text x="480" y="436" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600" fill="#24182f" text-anchor="middle">e pelo status social</text><text x="320" y="500" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#6c3483" text-anchor="middle">Debord: o status passa por cima da utilidade</text>
