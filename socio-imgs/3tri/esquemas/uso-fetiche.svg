<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.risco{animation:risco 4s linear infinite}@keyframes risco{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}.pena{animation:pena 4s linear infinite}@keyframes pena{0%{transform:translateX(0)}60%{transform:translateX(120px)}75%{transform:translateX(120px)}100%{transform:translateX(0)}}.aura{animation:aura 2.4s ease-in-out infinite}@keyframes aura{0%,100%{transform:scale(.9);opacity:.12}50%{transform:scale(1.06);opacity:.28}}.balanca{transform-box:view-box;transform-origin:515px 252px;animation:tag 2s ease-in-out infinite}@keyframes tag{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}.brilho{animation:pisca 1.6s ease-in-out infinite}.b2{animation-delay:.5s}.b3{animation-delay:1s}@keyframes pisca{0%,100%{transform:scale(.3);opacity:.2}50%{transform:scale(1.15);opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
