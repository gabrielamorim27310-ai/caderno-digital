<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560">
<defs><marker id="ponta" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="context-stroke"/></marker></defs>
<style>.giro,.pulsa,.cresce,.balanca,.brilho,.sobe{transform-box:fill-box;transform-origin:center}
.arco{animation:arco 8s ease-out infinite}.a1{animation-delay:.3s}.a2{animation-delay:.6s}.a3{animation-delay:.9s}@keyframes arco{0%{stroke-dashoffset:100}18%,100%{stroke-dashoffset:0}}.rot{animation:rot 8s ease-out infinite}.r1{animation-delay:.3s}.r2{animation-delay:.6s}.r3{animation-delay:.9s}@keyframes rot{0%,8%{opacity:0}20%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="640" height="560" rx="28" fill="#f6f1fb"/>
<text x="320" y="46" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="800" fill="#24182f" text-anchor="middle">Cosmologia ameríndia</text>
<path class="arco a0" d="M70 200 Q320 60 570 200" fill="none" stroke="#e0a800" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100"/><text x="320" y="168" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#e0a800" text-anchor="middle" class="rot r0">2º céu · Deuses</text><path class="arco a1" d="M100 270 Q320 160 540 270" fill="none" stroke="#2f6fd6" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100"/><text x="320" y="250" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#2f6fd6" text-anchor="middle" class="rot r1">1º céu · Espíritos</text><path class="arco a2" d="M80 340 L560 340" fill="none" stroke="#6c3483" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100"/><text x="320" y="328" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#6c3483" text-anchor="middle" class="rot r2">Humanos</text><path class="arco a3" d="M80 390 Q320 500 560 390" fill="none" stroke="#1f8a55" stroke-width="6" stroke-linecap="round" pathLength="100" stroke-dasharray="100"/><text x="320" y="420" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#1f8a55" text-anchor="middle" class="rot r3">Animais</text><path d="M150 445 L150 140" stroke="#c2336f" stroke-width="2" stroke-dasharray="3 7"/><circle class="xama" r="12" fill="#c2336f" stroke="#fff" stroke-width="2" style="offset-path:path('M150 445 L150 140 L150 445');animation:xama-v 5s linear 0s infinite"/><style>@keyframes xama-v{0%{offset-distance:0%;opacity:0}6%{opacity:1}94%{opacity:1}100%{offset-distance:100%;opacity:0}}</style><text x="150" y="125" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#c2336f" text-anchor="middle">xamã</text><text x="320" y="495" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600" fill="#24182f" text-anchor="middle">no princípio, humanos e animais eram a mesma coisa</text><text x="320" y="525" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#6c3483" text-anchor="middle">a diferença veio da perda dessa condição comum</text>
