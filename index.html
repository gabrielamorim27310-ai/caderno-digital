<title>Caderno Digital · 2ª série EM 2026</title>

<style>
  /* ── Só do painel ── */

  /* Cartões no estilo das listas inteligentes do Lembretes */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); margin: 0 0 var(--s-2); }
  .tile { background: var(--bg-2); border-radius: var(--r-md); padding: var(--s-3) var(--s-4); box-shadow: var(--shadow-card); display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: var(--s-2); align-items: center; }
  .tile .app-icon { grid-row: 1; width: 32px; height: 32px; border-radius: 50%; font-size: 1rem; }
  .tile .num { grid-row: 1; justify-self: end; font: 700 1.75rem/1 var(--font-display); color: var(--label); font-variant-numeric: tabular-nums; }
  .tile .lbl { grid-column: 1 / -1; margin-top: var(--s-2); font: 600 0.9375rem/1.2 var(--font); color: var(--label-2); }

  /* Estante "Continuar" no estilo do Livros */
  .shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 148px; gap: var(--s-3); overflow-x: auto; scroll-snap-type: x mandatory; padding: 2px 2px var(--s-2); margin: 0 -2px; scrollbar-width: none; }
  .shelf::-webkit-scrollbar { display: none; }
  .book { scroll-snap-align: start; text-decoration: none; color: var(--label); display: grid; gap: var(--s-2); }
  .book .cover { aspect-ratio: 3 / 4; border-radius: var(--r-sm) var(--r-md) var(--r-md) var(--r-sm); display: grid; place-items: center; font-size: 2.6rem; color: #fff; position: relative; overflow: hidden;
    background: linear-gradient(160deg, color-mix(in srgb, var(--c) 78%, #fff) 0%, var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000) 100%);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16), inset 3px 0 0 rgba(255, 255, 255, 0.18); transition: transform var(--dur) var(--ease); }
  .book .cover img { width: 62%; height: 62%; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3)); }
  .book .cover .tri { position: absolute; left: var(--s-2); bottom: var(--s-2); font: 600 0.6875rem/1 var(--font); background: rgba(0, 0, 0, 0.32); padding: 4px 7px; border-radius: var(--r-pill); }
  .book:active .cover { transform: scale(0.97); }
  @media (hover: hover) { .book:hover .cover { transform: translateY(-2px); } }
  .book .t { font: var(--t-subhead); font-weight: 600; line-height: 1.25; }
  .book .s { font: var(--t-footnote); color: var(--label-2); margin-top: -4px; }

  /* Linha de matéria: descrição em até 2 linhas */
  .cell-sub.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .cell .visto { display: block; font: var(--t-caption); color: var(--label-2); margin-top: 2px; }
  .cell.is-disabled { cursor: default; }
  .cell.is-disabled .cell-title, .cell.is-disabled .app-icon { opacity: 0.5; }

  .tri-panel[hidden] { display: none; }
  .empty { text-align: center; padding: var(--s-12) var(--s-4); color: var(--label-2); }
  .empty .i { width: 44px; height: 44px; color: var(--label-3); margin-bottom: var(--s-3); }
  .empty h2 { font: var(--t-title3); color: var(--label); margin: 0 0 var(--s-1); }
  .empty p { font: var(--t-subhead); margin: 0; }

  .search-field kbd { display: none; }
  @media (hover: hover) and (pointer: fine) { .search-field kbd { display: inline-block; } }

  .footer-note { text-align: center; font: var(--t-footnote); color: var(--label-2); margin: var(--s-10) 0 0; }
</style>
</head>
<body class="ios">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div class="app-layout">
  <aside class="sidebar" data-cd-sidebar aria-label="Matérias"></aside>

  <div class="app-main">
    <header class="navbar">
      <div class="navbar-row">
        <div class="navbar-left"></div>
        <span class="navbar-title" aria-hidden="true">Caderno Digital</span>
        <div class="navbar-right">
          <button class="bar-btn glass" type="button" data-cd-alternar-tema aria-label="Alternar modo claro e escuro">
            <svg class="i" aria-hidden="true"><use href="icons.svg#moon"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page" id="conteudo">
      <h1 class="large-title">Caderno Digital</h1>
      <p class="large-sub">2ª série do Ensino Médio · Colégio Bandeirantes · 2026</p>

      <label class="search-field" for="busca">
        <svg class="i" aria-hidden="true"><use href="icons.svg#search"/></svg>
        <input id="busca" type="search" placeholder="Buscar matéria ou assunto" autocomplete="off" enterkeyhint="go" aria-controls="resultados">
        <kbd>⌘K</kbd>
      </label>

      <section id="resultados" hidden aria-live="polite">
        <h2 class="group-title small" id="resultados-titulo">Resultados</h2>
        <div class="group" id="resultados-lista"></div>
      </section>

      <div id="painel">
        <div class="tiles">
          <div class="tile">
            <span class="app-icon" style="--icon-bg:#ff9500" aria-hidden="true"><svg class="i i-sm" style="color:#fff"><use href="icons.svg#flame"/></svg></span>
            <span class="num" id="streak">1</span>
            <span class="lbl" id="streak-lbl">dia seguido</span>
          </div>
          <div class="tile">
            <span class="app-icon" style="--icon-bg:var(--historia-fill)" aria-hidden="true"><svg class="i i-sm" style="color:#fff"><use href="icons.svg#book-open"/></svg></span>
            <span class="num" id="total-resumos">0</span>
            <span class="lbl">resumos</span>
          </div>
        </div>

        <section id="continuar" hidden aria-labelledby="continuar-titulo">
          <h2 class="group-title" id="continuar-titulo">Continuar</h2>
          <div class="shelf" id="estante"></div>
        </section>

        <h2 class="group-title" id="tri-titulo">Trimestres</h2>
        <div class="segmented" role="tablist" aria-labelledby="tri-titulo" id="tri-seg">
          <button type="button" role="tab" id="tab-t1" aria-controls="painel-t1" data-tri="t1">1º tri</button>
          <button type="button" role="tab" id="tab-t2" aria-controls="painel-t2" data-tri="t2">2º tri</button>
          <button type="button" role="tab" id="tab-t3" aria-controls="painel-t3" data-tri="t3">3º tri</button>
        </div>

        <section class="tri-panel" id="painel-t1" role="tabpanel" aria-labelledby="tab-t1" hidden></section>
        <section class="tri-panel" id="painel-t2" role="tabpanel" aria-labelledby="tab-t2" hidden></section>
        <section class="tri-panel" id="painel-t3" role="tabpanel" aria-labelledby="tab-t3" hidden></section>
      </div>

      <noscript>
        <div class="group">
          <a class="cell" href="historia-2tri.html">História · 2º tri</a>
          <a class="cell" href="biologia-2tri.html">Biologia · 2º tri</a>
          <a class="cell" href="geografia-2tri-america.html">Geografia · 2º tri</a>
          <a class="cell" href="sociologia-2tri.html">Sociologia · 2º tri</a>
          <a class="cell" href="filosofia-2tri.html">Filosofia · 2º tri</a>
          <a class="cell" href="ingles-2tri.html">Inglês · 2º tri</a>
          <a class="cell" href="matematica-2tri.html">Matemática · 2º tri</a>
        </div>
      </noscript>

      <p class="footer-note">Caderno Digital · 2ª série do Ensino Médio · 2026</p>
    </main>
  </div>
</div>

<nav class="tabbar" data-cd-tabbar aria-label="Navegação principal"></nav>

<script src="scripts/app.js"></script>
<script>
(function () {
  var M = MATERIAS;
  var ico = CD.icone, esc = CD.esc;

  /* ── Moldura ── */
  CD.montarSidebar(document.querySelector('[data-cd-sidebar]'));
  CD.montarTabbar(document.querySelector('[data-cd-tabbar]'), [
    { rotulo: 'Início', icone: 'house', href: 'index.html', atual: true },
    { rotulo: 'Buscar', icone: 'search', acao: 'buscar' },
    { rotulo: 'Mais', icone: 'ellipsis', sheet: 'sheet-mais' },
  ]);
  CD.criarSheetMais();
  CD.sincronizarTema();
  CD.ligarNavbar();

  /* Todas as páginas, incluindo extras (flashcards), como itens navegáveis */
  var paginas = [];
  M.forEach(function (m) {
    if (m.id) paginas.push({ id: m.id, m: m, nome: m.nome, desc: m.desc, tri: m.tri });
    (m.extras || []).forEach(function (x) {
      paginas.push({ id: x.id, m: m, nome: m.nome + ' · ' + x.nome, desc: 'Revisão do vocabulário', tri: m.tri, extra: true });
    });
  });
  document.getElementById('total-resumos').textContent = paginas.length;

  /* ── Linha de lista ── */
  function linha(p, comTri) {
    var ts = CD.ultimaVisita(p.id);
    var iconeHtml = p.extra
      ? '<span class="app-icon" style="--icon-bg:var(--' + p.m.materia + '-fill)"><svg class="i i-sm" aria-hidden="true" style="color:#fff"><use href="icons.svg#layers"/></svg></span>'
      : CD.appIcon(p.m);
    return '<a class="cell has-icon" href="' + p.id + '.html" data-visit="' + p.id + '">' + iconeHtml +
      '<span class="cell-body"><span class="cell-title">' + esc(p.nome) + '</span>' +
      '<span class="cell-sub clamp">' + (comTri ? p.tri + 'º tri · ' : '') + esc(p.desc) + '</span>' +
      (ts ? '<span class="visto">Visto ' + CD.tempoAtras(ts) + '</span>' : '') + '</span>' +
      ico('chevron-right', 'cell-chev') + '</a>';
  }
  function linhaEmBreve(m) {
    return '<div class="cell has-icon is-disabled">' + CD.appIcon(m) +
      '<span class="cell-body"><span class="cell-title">' + esc(m.nome) + '</span></span>' +
      '<span class="pill gray">em breve</span></div>';
  }
  function itensDe(lista) {
    var h = '';
    lista.forEach(function (m) {
      if (m.status === 'breve') { h += linhaEmBreve(m); return; }
      paginas.filter(function (p) { return p.m === m; }).forEach(function (p) { h += linha(p); });
    });
    return h;
  }

  /* ── Painéis de trimestre ── */
  function montarTri(n) {
    var el = document.getElementById('painel-t' + n);
    var doTri = M.filter(function (m) { return m.tri === n; });
    if (!doTri.length) {
      el.innerHTML = '<div class="empty">' + ico('clock') + '<h2>' + n + 'º trimestre</h2><p>Nenhum resumo ainda. Volte quando o trimestre começar!</p></div>';
      return;
    }
    var naProva = doTri.filter(function (m) { return m.status === 'prova'; });
    var fora = doTri.filter(function (m) { return m.status === 'fora'; });
    var resto = doTri.filter(function (m) { return m.status !== 'prova' && m.status !== 'fora'; });
    var h = '';
    if (naProva.length) h += '<h3 class="group-title small">Na prova</h3><div class="group">' + itensDe(naProva) + '</div>';
    if (resto.length) h += '<h3 class="group-title small">' + (naProva.length ? 'Outras' : 'Matérias') + '</h3><div class="group">' + itensDe(resto) + '</div>';
    if (fora.length) h += '<h3 class="group-title small">Fora da prova</h3><div class="group">' + itensDe(fora) + '</div>' +
      '<p class="group-footer">Conteúdo extra: não cai na prova deste trimestre.</p>';
    el.innerHTML = h;
  }
  [1, 2, 3].forEach(montarTri);

  /* ── Trimestre ativo: preserva os links index.html#t1 / #t2 das outras páginas.
     Os painéis se chamam painel-tN (e não tN) para o navegador não rolar até eles. ── */
  var tabs = Array.prototype.slice.call(document.querySelectorAll('#tri-seg [role="tab"]'));
  function setTri(id, foco) {
    tabs.forEach(function (t) {
      var sel = t.getAttribute('data-tri') === id;
      t.setAttribute('aria-selected', String(sel));
      t.tabIndex = sel ? 0 : -1;
      document.getElementById('painel-' + t.getAttribute('data-tri')).hidden = !sel;
      if (sel && foco) t.focus();
    });
    history.replaceState(null, '', '#' + id);
  }
  tabs.forEach(function (t, i) {
    t.addEventListener('click', function () { setTri(t.getAttribute('data-tri')); });
    t.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      setTri(tabs[(i + d + tabs.length) % tabs.length].getAttribute('data-tri'), true);
    });
  });
  var hash = location.hash.replace('#', '');
  // Sem #, abre o trimestre mais recente que tem resumos
  var ultimoTri = Math.max.apply(null, M.filter(function (m) { return m.id; }).map(function (m) { return m.tri; }));
  setTri(['t1', 't2', 't3'].indexOf(hash) >= 0 ? hash : 't' + ultimoTri);

  /* ── Continuar: últimas páginas abertas ── */
  var recentes = paginas
    .map(function (p) { return { p: p, ts: CD.ultimaVisita(p.id) }; })
    .filter(function (x) { return x.ts; })
    .sort(function (a, b) { return b.ts - a.ts; })
    .slice(0, 6);
  if (recentes.length) {
    document.getElementById('estante').innerHTML = recentes.map(function (x) {
      var m = x.p.m;
      var capa = x.p.extra ? '🗂️' : (m.imagem ? '<img src="' + esc(m.imagem) + '" alt="">' : esc(m.icone));
      return '<a class="book" href="' + x.p.id + '.html" data-visit="' + x.p.id + '">' +
        '<span class="cover" style="--c:var(--' + m.materia + '-fill)" aria-hidden="true">' + capa + '<span class="tri">' + x.p.tri + 'º tri</span></span>' +
        '<span class="t">' + esc(x.p.nome) + '</span><span class="s">' + CD.tempoAtras(x.ts) + '</span></a>';
    }).join('');
    document.getElementById('continuar').hidden = false;
  }

  /* Páginas ainda não migradas não marcam a visita sozinhas: marca no clique */
  document.addEventListener('click', function (e) {
    var a = e.target.closest('[data-visit]');
    if (a) CD.marcarVisita(a.getAttribute('data-visit'));
  });

  /* ── Sequência de dias visitando o painel (real, em localStorage; zera se pular um dia) ── */
  (function () {
    var KEY = 'cd_streak', hoje = new Date().toISOString().slice(0, 10), d = null;
    try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (!d) d = { count: 0, last: null };
    if (d.last !== hoje) {
      d.count = d.last && Math.round((new Date(hoje) - new Date(d.last)) / 86400000) === 1 ? d.count + 1 : 1;
      d.last = hoje;
      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    }
    document.getElementById('streak').textContent = d.count;
    document.getElementById('streak-lbl').textContent = d.count === 1 ? 'dia seguido' : 'dias seguidos';
  })();

  /* ── Busca: filtra nome e descrição das matérias; Enter abre o primeiro ── */
  var busca = document.getElementById('busca');
  var painel = document.getElementById('painel');
  var resultados = document.getElementById('resultados');
  var resLista = document.getElementById('resultados-lista');
  function normal(s) { return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
  var achados = [];
  busca.addEventListener('input', function () {
    var q = normal(busca.value.trim());
    if (!q) { resultados.hidden = true; painel.hidden = false; return; }
    var termos = q.split(/\s+/);
    achados = paginas.filter(function (p) {
      var alvo = normal(p.nome + ' ' + p.desc + ' ' + p.tri + 'º tri ' + p.m.materia);
      return termos.every(function (t) { return alvo.indexOf(t) >= 0; });
    }).sort(function (a, b) { return b.tri - a.tri; });   // trimestre mais recente primeiro
    resLista.innerHTML = achados.length ? achados.map(function (p) { return linha(p, true); }).join('')
      : '<div class="cell"><span class="cell-body"><span class="cell-sub">Nada encontrado para "' + esc(busca.value.trim()) + '".</span></span></div>';
    document.getElementById('resultados-titulo').textContent = achados.length + (achados.length === 1 ? ' resultado' : ' resultados');
    resultados.hidden = false;
    painel.hidden = true;
  });
  busca.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && achados.length && busca.value.trim()) {
      CD.marcarVisita(achados[0].id);
      location.href = achados[0].id + '.html';
    }
    if (e.key === 'Escape') { busca.value = ''; busca.dispatchEvent(new Event('input')); busca.blur(); }
  });
  function focarBusca() {
    scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    busca.focus();
  }
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); focarBusca(); }
    else if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); focarBusca(); }
  });
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-cd-acao="buscar"]')) focarBusca();
  });
})();
</script>
</body>
