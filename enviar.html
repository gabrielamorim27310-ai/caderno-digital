<!DOCTYPE html>
<html lang="pt-BR" data-pagina="enviar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Enviar resumo · Caderno Digital</title>
<meta name="description" content="Mande o seu resumo, fotos do caderno ou arquivos para ajudar a montar os resumos do Caderno Digital.">
<meta property="og:title" content="Envie o seu resumo · Caderno Digital">
<meta property="og:description" content="Texto, fotos do caderno ou arquivos. Os resumos do mesmo tópico são juntados e revisados antes de entrar no site.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno Digital">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles/ios.css">
<script src="scripts/theme.js"></script>
<script src="config.js"></script>
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-CL1RMGB3SN"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-CL1RMGB3SN');
</script>
<style>
  /* ── Só do formulário de envio ── */
  .page-enviar { max-width: 640px; }
  .form-group { padding: 0; }
  .form-row { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-3) var(--s-4); font: 600 0.8125rem/1.3 var(--font); color: var(--label-2); }
  .form-row + .form-row { border-top: 0.5px solid var(--sep); }
  .form-row[hidden] { display: none; }
  .form-row :is(select, input[type="text"], textarea) {
    width: 100%; font: var(--t-body); font-size: 16px; color: var(--label);
    background: var(--bg-3); border: 0.5px solid var(--sep); border-radius: var(--r-sm); padding: 10px 12px;
  }
  .form-row textarea { resize: vertical; min-height: 160px; }
  .form-row :is(select, input, textarea):focus-visible { outline: none; border-color: var(--tint); box-shadow: 0 0 0 3px var(--tint-bg); }
  .form-row select:disabled { opacity: 0.6; }
  .arquivo-btn { align-self: flex-start; position: relative; }
  .arquivo-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .arquivo-btn:focus-within { box-shadow: 0 0 0 3px var(--tint-bg); }
  .form-dica { font: var(--t-footnote); color: var(--label-2); font-weight: 400; }
  #contrib-files { list-style: none; margin: 0; padding: 0; font: var(--t-footnote); color: var(--label); font-weight: 400; display: grid; gap: 4px; }
  #contrib-status { margin: var(--s-4) var(--s-4) 0; font: var(--t-subhead); color: var(--label-2); min-height: 1.4em; }
  #contrib-status.ok { color: var(--green); } #contrib-status.erro { color: var(--red); }
  #contrib-send { margin-top: var(--s-4); }
  .contrib-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  .compartilhar { display: flex; gap: var(--s-2); align-items: center; margin: var(--s-8) var(--s-4) 0; flex-wrap: wrap; }
  .compartilhar span { font: var(--t-footnote); color: var(--label-2); }
</style>
</head>
<body class="ios">
<a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

<div class="app-layout">
  <aside class="sidebar" data-cd-sidebar aria-label="Matérias"></aside>

  <div class="app-main">
    <header class="navbar">
      <div class="navbar-row">
        <div class="navbar-left">
          <a class="bar-btn" href="index.html"><svg class="i" aria-hidden="true"><use href="icons.svg#chevron-left"/></svg>Início</a>
        </div>
        <span class="navbar-title" aria-hidden="true">Enviar resumo</span>
        <div class="navbar-right">
          <button class="bar-btn glass" type="button" data-cd-alternar-tema aria-label="Alternar modo claro e escuro">
            <svg class="i" aria-hidden="true"><use href="icons.svg#moon"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main class="page page-enviar" id="conteudo">
      <h1 class="large-title">Enviar resumo</h1>
      <p class="large-sub">Mande o seu resumo, fotos do caderno ou arquivos. Os envios do mesmo tópico são juntados e revisados antes de entrar no site.</p>

      <div id="enviar-raiz"></div>

      <div class="compartilhar">
        <button class="btn gray small" type="button" id="copiar-link">Copiar link desta página</button>
        <span id="copiar-status" role="status"></span>
      </div>

      <p class="footer-note">Caderno Digital · 2ª série do Ensino Médio · 2026</p>
    </main>
  </div>
</div>

<nav class="tabbar" data-cd-tabbar aria-label="Navegação principal"></nav>

<script src="scripts/app.js"></script>
<script src="scripts/contribuir.js"></script>
<script>
(function () {
  CD.montarSidebar(document.querySelector('[data-cd-sidebar]'));
  CD.montarTabbar(document.querySelector('[data-cd-tabbar]'), [
    { rotulo: 'Início', icone: 'house', href: 'index.html' },
    { rotulo: 'Enviar', icone: 'upload', href: 'enviar.html', atual: true },
    { rotulo: 'Mais', icone: 'ellipsis', sheet: 'sheet-mais' },
  ]);
  CD.criarSheetMais();
  CD.sincronizarTema();
  CD.ligarNavbar();

  // Copia o link com a matéria escolhida (o endereço acompanha o formulário)
  var botao = document.getElementById('copiar-link'), aviso = document.getElementById('copiar-status');
  botao.addEventListener('click', async function () {
    var url = location.origin + '/enviar' + location.search;
    try {
      if (navigator.share && matchMedia('(pointer: coarse)').matches) await navigator.share({ title: 'Envie o seu resumo', url: url });
      else { await navigator.clipboard.writeText(url); aviso.textContent = 'Link copiado.'; }
    } catch (e) { aviso.textContent = url; }
  });
})();
</script>
</body>
</html>
